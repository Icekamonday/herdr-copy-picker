id = "herdr-copy-picker"
name = "Copy picker"
version = "0.6.0"
min_herdr_version = "0.9.0"
description = "Copy the code blocks of Claude Code and Codex answers without the indent and the line breaks of the screen, or run them in a shell of the tab"
platforms = ["linux"]

# a popup, so that the picker knows the pane the key was pressed in: a
# temporary pane names only itself in HERDR_PANE_ID, and Herdr names the pane
# under a popup in HERDR_PLUGIN_CONTEXT_JSON. In a tab with two agents, that
# pane is the only way to tell which one is meant.
[[panes]]
id = "picker"
title = "Copy"
placement = "popup"
width = "100%"
height = "100%"
command = ["./bin/copy"]

[[actions]]
id = "pick"
title = "Copy from the answers of the agent"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-copy-picker",
           "--entrypoint", "picker"]
